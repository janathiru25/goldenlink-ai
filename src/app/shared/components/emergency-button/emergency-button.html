<!-- Emergency Floating Button -->

<button
  type="button"
  class="emergency-button"
  (click)="openEmergency()"
  [attr.aria-label]="t('emergency')"
>
  <span class="emergency-icon">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </span>

  <span class="emergency-text">
    {{ t('emergency') }}
  </span>
</button>


<!-- Emergency Dialog -->

@if (isEmergencyOpen) {

  <div
    class="emergency-overlay"
    (click)="closeEmergency()"
  >

    <div
      class="emergency-modal"
      (click)="$event.stopPropagation()"
    >

      <!-- Close -->

      <button
        type="button"
        class="close-button"
        (click)="closeEmergency()"
        [attr.aria-label]="t('close')"
      >
        <i class="bi bi-x-lg"></i>
      </button>


      <!-- Icon -->

      <div class="modal-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>


      <!-- Content -->

      <h2>
        {{ t('emergencyAssistance') }}
      </h2>

      <p>
        {{ t('emergencyQuestion') }}
      </p>


      <!-- Actions -->

      <div class="emergency-actions">

        <button
          type="button"
          class="report-button"
          (click)="reportAccident()"
        >
          <i class="bi bi-clipboard-plus"></i>
          {{ t('reportAccident') }}
        </button>


        <button
          type="button"
          class="call-button"
          (click)="callEmergency()"
        >
          <i class="bi bi-telephone-fill"></i>
          {{ t('call112') }}
        </button>


        <button
          type="button"
          class="cancel-button"
          (click)="closeEmergency()"
        >
          {{ t('cancel') }}
        </button>

      </div>

    </div>

  </div>

}
